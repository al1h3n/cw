# cargo-deny: licence compatibility with AGPL-3.0, security advisories, dependency sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Security vulnerabilities in anything are still denied. "Unmaintained" advisories, however, are only
# actionable for crates WE pull directly — the noise here is all deep transitive deps of iroh/tauri/
# winit (postcard->heapless->atomic-polyfill, netwatch->paste, tauri->unic-*, winit->ttf-parser, …)
# for which "no safe upgrade is available". Restrict the unmaintained lint to first-party deps.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow" # the list is a policy, not an inventory
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",   # public-domain-equivalent; pulled in transitively (e.g. via the tauri/iroh tree)
    "IJG",         # jpeg-encoder is "(MIT OR Apache-2.0) AND IJG"; the IJG part is permissive
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Our own crates are path deps with no version ("*"), which reads as a wildcard. Allow that for path
# deps only; a real crates.io wildcard is still denied.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
