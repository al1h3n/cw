name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install NASM (OpenH264 SIMD; see AGENTS.md Phase-0 notes)
        run: choco install nasm -y --no-progress

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/console/ui/package-lock.json

      - name: Build the Console UI
        working-directory: crates/console/ui
        run: |
          npm ci
          npm run build

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace

  # Licences, security advisories, dependency sources. deny.toml narrows the "unmaintained" lint to
  # our own crates and allows path-dep wildcards, so this is a real gate: a genuine vulnerability
  # (or a yanked/GPL-incompatible dep) fails CI.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
