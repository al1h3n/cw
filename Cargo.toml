[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny" # platform/media crates opt in with a crate-level #![allow(unsafe_code)] + SAFETY comments

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Debug info for *dependencies* is what makes `target/debug` enormous: it reached 60 GB of deps plus
# 30 GB of incremental data on the dev machine before this was set. We debug our own crates, not
# iroh, tauri or windows-rs, so keep full debug info for the workspace and drop it for everything
# else. Panic backtraces through our own code still carry file and line numbers.
[profile.dev.package."*"]
debug = false
