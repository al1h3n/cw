[package]
name = "capture-thumbs"
description = "Spike 0.4: DXGI Desktop Duplication -> GPU mip downscale -> change-only JPEG thumbnails; measure CPU."
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
jpeg-encoder = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
