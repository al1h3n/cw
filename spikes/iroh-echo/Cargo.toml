[package]
name = "iroh-echo"
description = "Spike 0.3: dial by public key over LAN (offline), hole punching or relay; measure RTT."
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
iroh = "1.2"
iroh-mdns-address-lookup = "0.5"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
