[package]
name = "h264-loop"
description = "Spike 0.5: DDA capture -> H.264 encode -> decode -> native window; per-stage timings."
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
openh264 = "0.9"
softbuffer = "0.4"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }
