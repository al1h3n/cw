[package]
name = "media-iroh"
description = "Spike 0.6: H.264 over iroh QUIC, one uni-stream per GOP, drop-and-keyframe recovery."
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
iroh = "1.2"
iroh-mdns-address-lookup = "0.5"
openh264 = "0.9"
softbuffer = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
