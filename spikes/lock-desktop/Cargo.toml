[package]
name = "lock-desktop"
description = "Spike 0.8: fullscreen lock UI (native or WebView2) on a separate Win32 desktop; screenshot proof."
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
jpeg-encoder = "0.7"
tao = "0.37"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
