[package]
name = "console-app"
description = "Teacher/admin console: pairs devices and watches their screens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cowatcher-console"
path = "src/main.rs"

[dependencies]
iroh = "1.2"
net = { path = "../net" }
proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] } # the teacher-facing GUI (AGENTS D13)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
