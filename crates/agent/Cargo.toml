[package]
name = "agent"
description = "Student-device agent: the supervising service and its per-session helper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cowatcher-agent"
path = "src/main.rs"

[dependencies]
iroh = "1.2"
media = { path = "../media" }
net = { path = "../net" }
platform = { path = "../platform" }
proto = { path = "../proto" }
thiserror = "2" # typed leave/membership errors, as the workspace does elsewhere
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
