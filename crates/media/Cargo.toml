[package]
name = "media"
description = "Screen capture and encoding. Per-OS backends behind cfg(target_os)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.18"
jpeg-encoder = "0.7"
openh264 = "0.9" # H.264 encode/decode for the full-resolution view (spike 0.5 proved it)
zune-jpeg = "0.4" # decode the teacher's screen for broadcast; pure Rust, no C in the static build
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
] }

[lints]
workspace = true
