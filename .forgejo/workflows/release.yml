# Codeberg CI (Forgejo Actions — GitHub-Actions-compatible syntax).
#
# IMPORTANT: Codeberg's shared runners are Linux Docker and CANNOT build Windows .exe files. To use
# this you need a SELF-HOSTED Windows runner registered to your repo with the label `windows`
# (see https://forgejo.org/docs/latest/admin/actions/). On a Linux-only setup, build on GitHub or a
# self-hosted Windows box and let Codeberg be a mirror (AGENTS.md D18 treats mirrors as transport).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows # a self-hosted Windows runner labelled "windows"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Install NASM + Inno Setup
        run: choco install nasm innosetup -y --no-progress

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the Console UI
        working-directory: crates/console/ui
        run: |
          npm ci
          npm run build

      - name: Build release binaries
        run: cargo build --release -p console-app -p agent -p viewer -p mcp

      - name: Stage + build the installer
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\cowatcher-console.exe dist\ -Force
          Copy-Item target\release\cowatcher-agent.exe   dist\ -Force
          Copy-Item target\release\cowatcher-viewer.exe  dist\ -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\cowatcher.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cowatcher-windows
          path: |
            installer/Output/cowatcher-setup.exe
            dist/cowatcher-console.exe
            dist/cowatcher-agent.exe
            dist/cowatcher-viewer.exe
